name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 xclip libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Create venv and install dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -r requirements.txt

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\python.exe -m unittest test_units -v
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Run unit tests (macOS/Linux)
        if: runner.os != 'Windows'
        run: .venv/bin/python -m unittest test_units -v
        env:
          QT_QPA_PLATFORM: offscreen
