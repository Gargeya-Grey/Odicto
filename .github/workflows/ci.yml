name: CI

on:
  # Every push runs every job: the release gate needs a full push run on the exact main commit.
  push:
    branches: [main, feature/*]
  # A pull request that changes only Markdown skips CI. The Markdown files that the test gate
  # reads stay in, and tests/test_ci_paths.py keeps this list complete.
  pull_request:
    paths:
      - '**'
      - '.*'
      - '.*/**'
      - '!**.md'
      - '!.*/**.md'
      - 'CHANGELOG.md'
      - 'docs/architecture.md'
      - 'docs/engineering-notes.md'
      - 'tools/release/release-notes.md'

permissions:
  contents: read

jobs:
  test:
    name: platform-${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26, macos-26-intel, xcode-27, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    env:
      ODICTO_RUNNER_LABEL: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install supported Python
        # The download from GitHub releases timed out once on macos-26-intel (4 Nov 2026),
        # after uv's own retries. A network error gets 3 tries; a real error still fails.
        shell: bash
        run: |
          for try in 1 2 3; do
            uv python install 3.12 && exit 0
            echo "uv python install failed (try $try of 3)"
            [ "$try" = 3 ] || sleep 30
          done
          exit 1
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 pulseaudio xclip xdotool xvfb xauth x11-utils libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=odicto_ci
          pactl set-default-source odicto_ci.monitor
      - name: Install macOS audio dependency
        if: runner.os == 'macOS'
        run: brew list portaudio >/dev/null 2>&1 || brew install portaudio
      - name: Fresh committed archive, real installer, native smoke and test gate
        shell: pwsh
        run: |
          if ($IsLinux) {
            xvfb-run -a env XDG_SESSION_TYPE=x11 WAYLAND_DISPLAY= uv run --no-project --python 3.12 tools/ci_platform_smoke.py --root "$env:RUNNER_TEMP/odicto-installed" --evidence "$env:RUNNER_TEMP/odicto-evidence" --sha $env:GITHUB_SHA
          } else {
            uv run --no-project --python 3.12 tools/ci_platform_smoke.py --root "$env:RUNNER_TEMP/odicto-installed" --evidence "$env:RUNNER_TEMP/odicto-evidence" --sha $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw 'Fresh installation or installed test gate failed' }
      - name: Real isolated X11 shortcut integration
        if: runner.os == 'Linux'
        run: |
          cd "$RUNNER_TEMP/odicto-installed"
          xvfb-run -a env QT_QPA_PLATFORM=xcb .venv/bin/python tools/x11_integration_check.py --output "$RUNNER_TEMP/odicto-evidence/x11.json"
      - name: Retain exact OS, install, test and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.os }}
          path: ${{ runner.temp }}/odicto-evidence/
          if-no-files-found: error

  latest-linux:
    name: platform-ubuntu-26.10-vm
    timeout-minutes: 45
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils ovmf acl
      - name: Fresh-install and test real Ubuntu 26.10 guest
        run: bash tools/ci_latest_linux.sh
      - name: Retain actual guest OS/kernel and installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-ubuntu-26.10-vm
          path: ${{ runner.temp }}/odicto-ubuntu2610-evidence/
          if-no-files-found: error
