# Publishes a GitHub Release of the desktop app: a zip of the commit plus its SHA-256.
# Run it by hand from the Actions tab, on main. The tag is v<VERSION>, so bump VERSION
# and add its section to CHANGELOG.md before each release.
name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release (beta)
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    # The platform gate may wait up to 100 minutes for CI and its runner retries.
    timeout-minutes: 140
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # Waits while CI on this commit runs or waits for the CI runner retry (a job GitHub
      # gave no runner); a real failure blocks at once. The rule itself is unchanged.
      - name: Require all platform install/test jobs for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release/check_platform_gate.py --repository $env:GITHUB_REPOSITORY --sha $env:GITHUB_SHA --output out/platform-gate.json --wait-minutes 100
          if ($LASTEXITCODE -ne 0) { throw 'Required platform evidence is missing or failed' }

      - name: Read version and refuse an existing tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'VERSION must be MAJOR.MINOR.PATCH' }
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Bump VERSION first." }
          if (git ls-remote --tags origin "refs/tags/$tag") { throw "Tag $tag already exists without a release. Delete the tag or bump VERSION." }
          $global:LASTEXITCODE = 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build the release notes from CHANGELOG.md
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match ('^## \[' + [regex]::Escape($version) + '\]')) { $start = $i; break }
          }
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $version." }
          $section = @()
          for ($i = $start + 1; $i -lt $lines.Count -and $lines[$i] -notmatch '^## '; $i++) { $section += $lines[$i] }
          New-Item -ItemType Directory -Force out | Out-Null
          $notes = (($section -join "`n").Trim()) + "`n`n" + (Get-Content tools/release/release-notes.md -Raw)
          [IO.File]::WriteAllText("$PWD/out/notes.md", $notes)

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      # The setup-page JS syntax gate needs node; the skip allow-list refuses a skip.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run the test gate
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The Python download can time out (seen in CI, 4 Nov 2026): 3 tries, 30 s apart.
          foreach ($try in 1..3) {
            uv venv --clear --python 3.12 .venv
            if ($LASTEXITCODE -eq 0) { break }
            if ($try -eq 3) { throw 'uv venv failed' }
            Start-Sleep -Seconds 30
          }
          uv pip sync --python .venv --require-hashes tools/distribution/requirements.lock
          if ($LASTEXITCODE -ne 0) { throw 'dependency install failed' }
          .venv\Scripts\python.exe tools/run_tests.py
          if ($LASTEXITCODE -ne 0) { throw 'test gate failed' }

      # git archive packs the committed tree only: no venv, .env, logs or model weights.
      - name: Package the release files
        id: package
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $name = "Odicto-$tag.zip"
          git archive --format=zip --prefix=Odicto/ -o "out/$name" $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }
          $hash = (Get-FileHash "out/$name" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/out/$name.sha256", "$hash  $name`n")
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $name = '${{ steps.package.outputs.name }}'
          $flags = @()
          if ('${{ inputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create $tag "out/$name" "out/$name.sha256" "out/platform-gate.json" `
            --target $env:GITHUB_SHA --title "Odicto $tag" `
            --notes-file out/notes.md --generate-notes @flags
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
