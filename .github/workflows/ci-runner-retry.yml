name: CI runner retry

# GitHub sometimes cancels a hosted job after ~15 minutes because no runner took it
# (macOS arm64 capacity, 4 Nov 2026). Such a job never ran, so this workflow re-runs it,
# up to 5 attempts in total. A real failure is never re-run. See tools/ci_rerun_unacquired.py.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: CI run id to check and re-run
        required: true
        type: string

permissions:
  actions: write
  checks: read
  contents: read

concurrency:
  group: ci-runner-retry-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  retry:
    # A manual start runs only from the default branch, so no branch's copy of the script
    # ever runs with the write token.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-26.04
    timeout-minutes: 110
    steps:
      # The default branch's own script; no code from the pull request is checked out or run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tools/ci_rerun_unacquired.py
          sparse-checkout-cone-mode: false
      - name: Re-run jobs that GitHub never gave a runner
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: python3 -I tools/ci_rerun_unacquired.py --repository "$REPOSITORY" --run-id "$RUN_ID" --max-attempts 5 --deadline-minutes 90
